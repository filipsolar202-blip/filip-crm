 policies:{title:'Pojistné smlouvy',single:'pojistnou smlouvu',fields:{person:'Pojištěná osoba / majetek',type:'Druh pojištění',provider:'Pojišťovna',number:'Číslo smlouvy',coverage:'Rizika a sjednané částky',beneficiary:'Obmyšlená osoba',phone:'Asistence / hlášení',location:'Kde je smlouva',notes:'Výluky, čekací doba, poznámka'}},
 services:{title:'Provoz domácnosti',single:'provozní smlouvu',fields:{service:'Služba (energie, telefon…)',provider:'Dodavatel',holder:'Na koho je smlouva',number:'Číslo smlouvy / zákazníka',payment:'Částka a splatnost',phone:'Kontakt na dodavatele',location:'Kde je smlouva',notes:'Jak převést / další pokyny'}},
 access:{title:'Peníze a dokumenty dostupné hned',single:'místo / zdroj',fields:{name:'Účet, rezerva nebo dokument',holder:'Majitel',provider:'Banka / instituce / úložiště',authorized:'Oprávněná osoba',amount:'Dostupná částka (Kč, pokud znáte)',location:'Kde je návod / dokument',notes:'Podmínky přístupu (bez hesel)'}},
 benefits:{title:'Státní a soukromé zabezpečení',single:'nárok / odhad',fields:{person:'Koho se týká',event:'Situace',source:'Zdroj plnění',amount:'Částka (Kč, pokud znáte)',period:'Za den / měsíc / jednorázově',status:'Odhad / potvrzeno / k ověření',basis:'Podklad a datum výpočtu',notes:'Podmínky a postup žádosti'}},
 tasks:{title:'Dohodnuté další kroky',single:'úkol',fields:{task:'Co je potřeba udělat',owner:'Kdo to zařídí',due:'Do kdy',status:'Stav',notes:'Poznámka'}}
};
function blankCrisis(){return Object.fromEntries(Object.keys(crisisTables).map(k=>[k,[]]));}
function crisisOf(c){return {...blankCrisis(),...(c.crisis||{})};}
function advisorOf(c){return {...advisorDefaults,...(c.advisor||{})};}
function planPeople(c){
 const living=c.people.filter(p=>!p.dead&&!p.death&&p.id!=='STATE');
 const primary=living.find(p=>p.id===c.plan?.primary)||living[0];
 if(!primary)return [];
 const relation=c.relations.find(r=>[r.a,r.b].includes(primary.id)&&r.start<=c.date&&(!r.end||r.end>c.date)&&living.some(p=>p.id===(r.a===primary.id?r.b:r.a)));
 const partner=c.plan?.partner===''?null:living.find(p=>p.id===(c.plan?.partner|| (relation?.a===primary.id?relation?.b:relation?.a)));
 return [primary,...partner&&partner.id!==primary.id?[partner]:[]];
}
function extensionErrors(c){
 const out=[...exchangeErrors(c.exchange),...contactErrors(c.contact)];
 if(c.crisis!==undefined){
  if(!c.crisis||typeof c.crisis!=='object'||Array.isArray(c.crisis))return ['Neplatná data krizového plánu.'];
  for(const [key,schema] of Object.entries(crisisTables)){
   const rows=c.crisis[key];if(rows===undefined)continue;
   if(!Array.isArray(rows)||rows.length>200){out.push('Neplatný seznam: '+schema.title);continue;}
   if(rows.some(row=>!row||typeof row!=='object'||Array.isArray(row)||Object.entries(row).some(([k,v])=>k!=='id'&&!Object.hasOwn(schema.fields,k)||typeof v!=='string'||v.length>2000)))out.push('Neplatný záznam: '+schema.title);
  }
 }
 if(c.advisor!==undefined&&(!c.advisor||typeof c.advisor!=='object'||Array.isArray(c.advisor)||Object.values(c.advisor).some(v=>typeof v!=='string'||v.length>4000)))out.push('Neplatné kontakty poradce.');
 if(c.plan!==undefined&&(!c.plan||typeof c.plan!=='object'||Array.isArray(c.plan)||Object.values(c.plan).some(v=>typeof v!=='string'||v.length>4000)))out.push('Neplatné nastavení výstupů.');
 return out;
}
function disclaimer(c){
 const a=advisorOf(c);
 return `Zpracoval ${a.name} · ${a.brand}. Tento plán je informační a finanční pomůckou sestavenou z údajů klienta ke dni ${c.date}. Není závětí, dědickou smlouvou ani individuálním právním stanoviskem. Výpočty zachycují uvedené modelové předpoklady; skutečné vypořádání SJM, dědictví a dluhů určí příslušné řízení a platné dokumenty. Právní provedení řešení projednejte s notářem nebo advokátem. Nároky na státní dávky a pojistné plnění posuzuje příslušná instituce podle konkrétních podmínek. Částky bez doloženého podkladu jsou odhady. Při změně rodiny, majetku či smluv plán aktualizujte.`;
}

const intakeType='family-plan-questionnaire';
const choices=[['yes','Ano'],['no','Ne'],['unknown','Nevím, potřebuji pomoct']];
const roles={child:'Moje dítě',spouse:'Manžel / manželka',partner:'Partner / partnerka (bez svatby)',ex:'Bývalý partner / manželství',parent:'Můj rodič',sibling:'Můj sourozenec',other:'Jiný člen rodiny nebo domácnosti'};
const criticalQuestions={children:'Máte děti? Počítejte i děti z dřívějších vztahů a děti, které už zemřely.',otherFamily:'Patří do příběhu další lidé? Například rodiče, sourozenci, vnoučata nebo děti partnera.',will:'Máte závěť, dědickou smlouvu nebo jiný dokument o dědictví?',maritalProperty:'Máte smlouvu, která mění společné vlastnictví manželů?',gifts:'Darovali jste někomu větší majetek nebo převedli majetek mezi partnery?',exceptions:'Je v rodině osvojení, vydědění, odmítnutí nebo zřeknutí se dědictví?',international:'Má někdo důležitý vztah k zahraničí? Třeba tam bydlí nebo vlastní majetek.',assets:'Máte nějaký majetek? Třeba bydlení, peníze, auto nebo firmu.',debts:'Máte dluh, hypotéku nebo za někoho ručíte?'};
const budgetLabels={expenses:'Kolik domácnost každý měsíc utratí?',income:'Kolik by měsíčně přicházelo bez vašeho příjmu?',months:'Na kolik měsíců chcete rodinu zajistit?',oneOff:'Kolik si připravit na jednorázové výdaje?',reserve:'Kolik peněz by rodina mohla hned použít?',insurance:'Kolik by podle pojistky rodina mohla dostat?'};
function newIntake(){return {type:intakeType,version:1,status:'draft',date:new Date().toISOString().slice(0,10),self:{name:'',birth:'',birthUnknown:false,status:'',marriageDate:'',marriageUnknown:false},people:[],answers:{},assets:[],budget:Object.fromEntries(Object.keys(budgetLabels).map(k=>[k,{value:'',unknown:false}])),manual:{contact:'',children:'',documents:'',payments:'',insurance:'',access:'',firstDays:'',notary:'',notes:''},confirm:{family:false,property:false,truth:false,delivery:false},notes:''};}
const dateOK=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&Number.isFinite(Date.parse(x))&&new Date(x).toISOString().slice(0,10)===x;
const textOK=(x,max=4000)=>typeof x==='string'&&x.length<=max;
const amountOK=x=>typeof x==='string'&&x.trim()!==''&&Number.isFinite(Number(x))&&Number(x)>=0&&Number(x)<=1e12;
function intakeErrors(d,step=null){
 const out=[],at=(n,msg)=>{if(step===null||step===n)out.push(msg);};
 if(!d||d.type!==intakeType||d.version!==1||!d.self||!Array.isArray(d.people)||!d.answers||!Array.isArray(d.assets)||!d.budget||!d.manual||!d.confirm)return ['Neplatný soubor dotazníku.'];
 if([d.self,d.answers,d.budget,d.manual,d.confirm].some(v=>typeof v!=='object'||Array.isArray(v)))return ['Neplatná struktura dotazníku.'];
 for(const message of [...exchangeErrors(d.exchange),...contactErrors(d.self)])at(0,message);
 for(const message of extensionErrors({crisis:d.crisis}))at(5,message);
 if(d.people.length>100||d.assets.length>500)return ['Dotazník je příliš velký.'];
 if(!textOK(d.self.name,120)||!d.self.name.trim())at(0,'Napište, jak vám máme říkat.');
 if(!d.self.birthUnknown&&(!dateOK(d.self.birth)||d.self.birth>d.date))at(0,'Doplňte narození, nebo zvolte Nevím.');
 if(!['single','married','partner','divorced','widowed','registered','unknown'].includes(d.self.status))at(0,'Vyberte svou rodinnou situaci.');
 if(d.self.status==='married'&&!d.self.marriageUnknown&&(!dateOK(d.self.marriageDate)||d.self.marriageDate>d.date))at(0,'Doplňte datum svatby, nebo zvolte Nevím.');
 if(d.people.some(p=>!p||typeof p!=='object')||d.assets.some(a=>!a||!['asset','debt'].includes(a.kind)))return ['Poškozený seznam osob nebo majetku.'];
 if([d.self.birthUnknown,d.self.marriageUnknown,...d.people.map(p=>p.birthUnknown),...d.assets.map(a=>a.valueUnknown),...Object.values(d.budget).map(b=>b?.unknown)].some(v=>typeof v!=='boolean'))return ['Neplatné označení neznámých údajů.'];
 if(d.people.some(p=>!textOK(p.note||''))||d.assets.some(a=>!textOK(a.note||'')||!textOK(a.category||'',120)))return ['Příliš dlouhý popis.'];
 const ids=d.people.map(p=>p.id);if(new Set(ids).size!==ids.length)at(1,'Osoby mají duplicitní identifikátory.');
 for(const p of d.people){if(!p||!textOK(p.id,100)||!textOK(p.name,120)||!p.name.trim()||!Object.hasOwn(roles,p.role)){at(1,'U každé osoby vyplňte jméno a vztah.');continue;}
 if(!['alive','dead','unknown'].includes(p.life))at(1,`U osoby ${p.name} vyberte, zda žije.`);
 if(!p.birthUnknown&&(!dateOK(p.birth)||p.birth>d.date))at(1,`Doplňte narození osoby ${p.name}, nebo zvolte Nevím.`);
 if(p.role==='child'&&!['only','unknown',...ids.filter(x=>x!==p.id)].includes(p.otherParent))at(1,`U dítěte ${p.name} označte druhého rodiče, nebo zvolte Nevím.`);
 if(p.role==='other'&&(!textOK(p.note)||!p.note.trim()))at(1,`U osoby ${p.name} popište vztah k rodině.`);
 if(p.role==='partner'&&(!['yes','no','unknown'].includes(p.year)||!['yes','no','unknown'].includes(p.care)))at(1,`U partnera ${p.name} doplňte společné bydlení.`);}
 if(d.people.filter(p=>p.role==='spouse').length>1)at(1,'Uveďte jen jednoho současného manžela nebo manželku.');
 if(d.people.filter(p=>p.role==='parent').length>2)at(1,'Více než dva rodiče popište jako jiného člena rodiny.');
 if(d.self.status==='married'&&!d.people.some(p=>p.role==='spouse'))at(1,'Přidejte svého manžela nebo manželku.');
 if(d.self.status==='partner'&&!d.people.some(p=>p.role==='partner'))at(1,'Přidejte svého partnera nebo partnerku.');
 for(const k of ['children','otherFamily'])if(!['yes','no','unknown'].includes(d.answers[k]))at(1,'Odpovězte na obě otázky o rodině.');
 if(d.answers.children==='yes'&&!d.people.some(p=>p.role==='child'))at(1,'Přidejte alespoň jedno dítě.');
 if(d.answers.children==='no'&&d.people.some(p=>p.role==='child'))at(1,'Máte uvedené dítě, ale odpověď je Ne. Opravte odpověď.');
 if(d.answers.otherFamily==='yes'&&!d.people.some(p=>['parent','sibling','other','ex'].includes(p.role)))at(1,'Přidejte dalšího člena rodiny a jeho vztah.');
 for(const [n,kind,key] of [[2,'asset','assets'],[3,'debt','debts']]){if(!['yes','no','unknown'].includes(d.answers[key]))at(n,'Vyberte Ano, Ne nebo Nevím.');const items=d.assets.filter(a=>a.kind===kind);if(d.answers[key]==='yes'&&!items.length)at(n,'Přidejte alespoň jednu položku.');if(d.answers[key]==='no'&&items.length)at(n,'Máte vyplněné položky. Opravte odpověď Ne.');
 for(const a of items){if(!textOK(a.category,120)||!a.category.trim())at(n,'U každé položky vyberte, co to je.');if(!textOK(a.name,120)||!a.name.trim())at(n,'Pojmenujte každou položku.');if(!a.valueUnknown&&!amountOK(a.value))at(n,`U položky ${a.name} doplňte částku nebo Nevím.`);if(!['CZK','EUR','USD'].includes(a.currency))at(n,'Vyberte měnu.');if(!['me','person','joint','shares','unknown'].includes(a.owner))at(n,`U položky ${a.name} vyberte vlastníka nebo Nevím.`);if(['person','shares'].includes(a.owner)&&!ids.includes(a.person))at(n,`U položky ${a.name} vyberte druhou osobu.`);if(a.owner==='joint'&&!d.people.some(p=>p.role==='spouse'))at(n,'Společné jmění vyžaduje uvedeného manžela nebo manželku.');if(a.owner==='shares'&&(!amountOK(a.share)||Number(a.share)<=0||Number(a.share)>=100))at(n,'Váš podíl musí být větší než 0 a menší než 100 %.');if(!['purchase','before','gift','inheritance','unknown'].includes(a.acquisition))at(n,'U každé položky vyberte původ majetku nebo okolnost vzniku dluhu.');}}
 for(const k of ['will','maritalProperty','gifts','exceptions','international'])if(!['yes','no','unknown'].includes(d.answers[k]))at(4,'Odpovězte na každou důležitou otázku.');
 if(Object.values(d.manual).some(v=>!textOK(v))||!textOK(d.notes))at(5,'Poznámky mohou mít nejvýše 4 000 znaků.');
 for(const k of Object.keys(budgetLabels)){const b=d.budget[k];if(!b||!b.unknown&&!amountOK(b.value))at(5,`Doplňte: ${budgetLabels[k]} Nebo zvolte Nevím.`);if(k==='months'&&b&&!b.unknown&&(!Number.isInteger(Number(b.value))||Number(b.value)<1||Number(b.value)>600))at(5,'Doba zajištění musí být 1 až 600 celých měsíců.');}
 for(const k of ['family','property','truth','delivery'])if(d.confirm[k]!==true)at(6,'Na konci potvrďte všechny čtyři body.');if(!dateOK(d.date))at(0,'Neplatné datum dotazníku.');return [...new Set(out)];
}
function draftErrors(d){return [...draftShapeErrors(d),...extensionErrors({crisis:d?.crisis})];}
function parseIntake(text,{draft=false}={}){
 if(text.length>5_000_000)throw Error('Maximum 5 MB.');const d=parseExchangeJSON(text);
 if(d?.type!==intakeType||d.version!==1)throw Error('Nejde o podporovaný dotazník.');
 if(!draft&&d.status!=='submitted')throw Error('Toto je rozpracovaný dotazník. Klient musí stáhnout hotové odpovědi v posledním kroku.');
 const errors=draft?draftErrors(d):[...draftErrors(d),...intakeErrors(d)];if(errors.length)throw Error(errors.join('\n'));return d;
}

const root=document.getElementById('questionnaire');let draft=newIntake(),step=0,errors=[],success=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const steps=['O vás','Vaši blízcí','Co vlastníte','Co splácíte','Důležité věci','Peníze a pomoc','Kontrola'];
const titles=['Začneme u vás.','Kdo patří do vaší rodiny?','Co vaše rodina vlastní?','Co ještě zbývá splatit?','Pět věcí, které nesmíme přehlédnout.','Co rodina potřebuje každý den?','Ještě poslední kontrola.'];
const hints=['Není to zkouška. Stačí jednoduché odpovědi. Když si nejste jistí, vyberte „Nevím“.','Přidejte lidi po jednom. Nezapomeňte na děti z dřívějších vztahů ani na zemřelé děti.','Přidejte třeba dům, byt, účet, investice nebo auto. U částky stačí rozumný odhad.','Napište zbývající dluh, ne původní půjčenou částku. Dluhy neodečítejte z hodnoty domu.','Některé dokumenty a vztahy mohou změnit celý výsledek. Každá otázka potřebuje odpověď.','Představte si, že váš příjem přestane chodit. Co bude rodina potřebovat?','Odpovědi nejdřív zkontroluje poradce. Tento dotazník sám nerozhoduje, kdo bude dědit.'];
const icons=[`<circle cx="32" cy="17" r="10"/><path d="M12 56V46a20 20 0 0 1 40 0v10z"/>`,`<circle cx="20" cy="17" r="8"/><circle cx="46" cy="20" r="7"/><path d="M4 54V42a16 16 0 0 1 32 0v12zM36 54V40a12 12 0 0 1 24 0v14z"/>`,`<path d="M6 29 32 7l26 22v29H38V40H26v18H6z"/>`,`<rect x="8" y="10" width="48" height="45" rx="6"/><path d="M18 24h28M18 34h20M18 44h13" stroke="white" stroke-width="4"/>`,`<path d="M32 4 56 14v18c0 13-11 22-24 29C19 54 8 45 8 32V14z"/><path d="m20 31 8 8 17-19" fill="none" stroke="white" stroke-width="5"/>`,`<circle cx="32" cy="32" r="26"/><path d="M23 20h17M23 32h17M23 44h17M32 15v34" stroke="white" stroke-width="4"/>`,`<circle cx="32" cy="32" r="27"/><path d="m16 32 11 11 22-25" fill="none" stroke="white" stroke-width="5"/>`];
const icon=n=>`<div class="q-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="currentColor">${icons[n]}</svg></div>`;
const get=path=>path.split('.').reduce((o,k)=>o?.[k],draft);
function put(path,value){const parts=path.split('.');let o=draft;for(const k of parts.slice(0,-1))o=o[k];o[parts.at(-1)]=value;draft.status='draft';}
const opt=(list,val)=>list.map(([v,l])=>`<option value="${esc(v)}" ${val===v?'selected':''}>${esc(l)}</option>`).join('');
function field(path,label,{type='text',extra='',hint=''}={}){return `<label>${label}<input data-path="${path}" type="${type}" value="${esc(get(path))}" ${extra}>${hint?`<span class="q-help">${hint}</span>`:''}</label>`;}
function select(path,label,list){return `<label>${label}<select data-path="${path}">${opt([['','Vyberte odpověď…'],...list],get(path))}</select></label>`;}
function checkbox(path,label,cls=''){return `<label class="check ${cls}"><input type="checkbox" data-path="${path}" ${get(path)?'checked':''}>${label}</label>`;}
function textarea(path,label,hint=''){return `<label>${label}<textarea data-path="${path}" maxlength="4000">${esc(get(path))}</textarea>${hint?`<span class="q-help">${hint}</span>`:''}</label>`;}
function question(key){return `<fieldset class="q-question"><legend>${criticalQuestions[key]} <span class="q-required">Důležité • odpovězte</span></legend><div class="q-choices">${choices.map(([v,l])=>`<label class="q-choice"><input type="radio" name="${key}" data-path="answers.${key}" value="${v}" ${draft.answers[key]===v?'checked':''}>${l}</label>`).join('')}</div></fieldset>`;}
function amount(path,label){return `<div>${field(path+'.value',label,{type:'number',extra:`min="0" step="any" ${get(path+'.unknown')?'disabled':''}`})}${checkbox(path+'.unknown','Nevím, doplním s poradcem')}</div>`;}
function render(){draft.crisis=crisisOf(draft);root.innerHTML=`<div class="q-shell"><header class="q-head"><div><img src="${fairLifeLogo}" alt="FairLife" style="width:145px"><br><strong>Moje rodina a její plán</strong></div><div class="q-tools"><button data-action="draft">Uložit rozpracované</button><button data-action="resume">Pokračovat ze souboru</button></div></header>${draft.exchange?'<div class="q-tip">Dotazník obsahuje předvyplněné podklady. Projděte je a opravte, co se změnilo. Neznámé údaje můžete ponechat jako „Nevím“.</div>':''}${success?finished():`<nav class="q-steps" aria-label="Kroky dotazníku">${steps.map((s,i)=>`<button data-step="${i}" ${i===step?'aria-current="step"':''}>${i+1}. ${s}</button>`).join('')}</nav><div class="progress" aria-label="Průběh dotazníku"><i style="width:${(step+1)/7*100}%"></i></div><div class="q-hero">${icon(step)}<div><div class="eyebrow">Krok ${step+1} ze 7</div><h1 tabindex="-1">${titles[step]}</h1><p class="sub">${hints[step]}</p></div></div><div class="q-tip">${step===0?'Připravte si asi 15–25 minut. Nepíšete žádná hesla, rodná čísla ani čísla účtů. Částky mohou být přibližné.':'„Nevím“ je v pořádku. Odpověď nezmizí — poradce ji dostane jako důležitý bod k doplnění.'}</div><div id="q-errors" tabindex="-1" ${errors.length?'class="q-errors" role="alert"':''}>${errors.length?'<b>Ještě potřebujeme:</b><ul>'+errors.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>':''}</div><form class="q-form" novalidate>${body()}<div class="q-actions"><button type="button" data-action="back" ${step===0?'disabled':''}>← Zpět</button><button class="primary" type="submit">${step===6?'Dokončit a stáhnout odpovědi':'Pokračovat →'}</button></div></form>`}<p class="q-status" role="status" id="q-status"></p><footer>Odpovědi jsou jen v otevřené stránce. Před zavřením stáhněte rozpracovaný soubor. Hotový soubor předejte poradci dohodnutým bezpečným způsobem — stažení samo o sobě nic neodesílá.</footer></div>`;}
function body(){if(step===0)return `<div class="q-card"><div class="form-grid">${field('self.name','Jak vám máme říkat? ★',{extra:'maxlength="120" autocomplete="name"',hint:'Jméno a příjmení, nebo dohodnuté označení případu.'})}<div>${field('self.birth','Kdy jste se narodili? ★',{type:'date',extra:draft.self.birthUnknown?'disabled':''})}${checkbox('self.birthUnknown','Datum teď nevím')}</div>${field('self.email','E-mail (nepovinné)',{type:'email',extra:'maxlength="254" autocomplete="email"'})}${field('self.phone','Telefon (nepovinné)',{type:'tel',extra:'maxlength="254" autocomplete="tel"'})}${field('self.address','Adresa (nepovinné)',{extra:'maxlength="1000" autocomplete="street-address"'})}${select('self.appearance','Jakou postavičku chcete v plánu? (nepovinné)',[['male','Muž'],['female','Žena'],['neutral','Neutrální']])}${select('self.status','Jaká je vaše situace? ★',[['single','Nemám manžela/manželku ani partnera'],['married','Jsem ženatý / vdaná'],['partner','Žiji s partnerem bez svatby'],['divorced','Jsem rozvedený/á, bez nového manželství'],['widowed','Jsem vdovec / vdova, bez nového manželství'],['registered','Partnerství / registrované partnerství'],['unknown','Nevím, potřebuji vysvětlit']])}</div>${draft.self.status==='married'?`<div class="form-grid" style="margin-top:18px"><div>${field('self.marriageDate','Kdy byla vaše současná svatba? ★',{type:'date',extra:draft.self.marriageUnknown?'disabled':''})}${checkbox('self.marriageUnknown','Datum svatby teď nevím')}</div></div>`:''}<p class="q-help">★ Bez odpovědi nebo výslovného „Nevím“ se neposuneme dál. Jde o údaje, které mohou změnit výsledek.</p></div>`;
 if(step===1)return `${question('children')}${question('otherFamily')}<p class="q-help"><strong>Koho přidat?</strong> Současného i bývalého partnera, všechny své děti, rodiče a další důležité příbuzné. U zemřelého dítěte přidejte jeho děti jako „Jiný člen“ a napište vztah. Dítě partnera bez vašeho právního rodičovství patří také do „Jiný člen“.</p>${draft.people.map((p,i)=>personCard(p,i)).join('')}<button type="button" data-action="person">+ Přidat člověka</button>`;
 if(step===2||step===3){const kind=step===2?'asset':'debt';return `${question(step===2?'assets':'debts')}<p class="q-help">${step===2?'Dům za 6 milionů a hypotéku 2 miliony zapište zvlášť. Zde je dům za celých 6 milionů.':'Zde by byla hypotéka 2 miliony. Stejný dluh zapisujte jen jednou. U ručení napište maximální částku, za kterou odpovídáte, nebo Nevím.'}</p>${draft.assets.map((a,i)=>a.kind===kind?assetCard(a,i):'').join('')}<button type="button" data-action="${kind}">+ ${kind==='asset'?'Přidat majetek':'Přidat dluh nebo ručení'}</button>`;}
 if(step===4)return `${['will','maritalProperty','gifts','exceptions','international'].map(question).join('')}${textarea('manual.documents','Kde jsou důležité dokumenty a co přibližně říkají?','Například: závěť je u notáře; smlouva o odděleném majetku je doma. Nevkládejte celé listiny.')}${textarea('notes','Je něco složitějšího, co máme vědět?','Například spor o majetek, jiný rodič dítěte, vlastnictví ve více zemích.')}`;
 if(step===5)return `<div class="q-card"><h2>Peníze na běžný život</h2><div class="form-grid">${Object.entries(budgetLabels).map(([k,l])=>amount('budget.'+k,l+(k==='months'?' ★':' (Kč) ★'))).join('')}</div><p class="q-help">Odhad stačí. Nula znamená opravdu nic. Když částku neznáte, použijte „Nevím“. Pojistka neznamená jisté vyplacení.</p></div><div class="q-card"><h2>Kdo a co pomůže rodině?</h2><p class="q-help">Tato část je dobrovolná. Co nevíte, doplníte s poradcem.</p>${textarea('manual.contact','Na koho se rodina může obrátit?','Jméno a kontakt na člověka, kterému věříte.')}${textarea('manual.children','Kdo pomůže s dětmi nebo dalšími blízkými?')}${textarea('manual.payments','Co se musí dál platit?','Bydlení, energie, škola, splátky…')}${textarea('manual.insurance','Kde rodina najde pojistky?')}${textarea('manual.access','Kde najde návod k důležitým přístupům?','Jen umístění návodu. Nikdy sem nepište hesla ani PINy.')}${textarea('manual.firstDays','Co má rodina udělat během prvních dnů?')}${textarea('manual.notary','Na co se chcete zeptat poradce nebo notáře?')}</div>${crisisQuestions()}`;
 return `<div class="q-summary"><div><b>${draft.people.length+1}</b>počet osob v rodině</div><div><b>${draft.assets.filter(a=>a.kind==='asset').length}</b>majetkových položek</div><div><b>${draft.assets.filter(a=>a.kind==='debt').length}</b>dluhů / ručení</div></div><div class="q-card"><h2>${esc(draft.self.name)}</h2><p>Rodina: ${draft.people.map(p=>esc(p.name)+' ('+roles[p.role]+')').join(', ')||'Další osoby neuvedeny.'}</p><p>Majetek a dluhy: ${draft.assets.map(a=>esc(a.name)+' — '+(a.valueUnknown?'částku doplníme':esc(Number(a.value).toLocaleString('cs-CZ')+' '+a.currency))).join('; ')||'Bez uvedených položek.'}</p><p>Rodinná příručka: ${Object.entries(crisisTables).filter(([key])=>key!=='tasks').map(([key,s])=>esc(s.title)+': '+draft.crisis[key].length).join(' · ')}</p><p><b>Odpovědi „Nevím“:</b> ${Object.values(draft.answers).filter(x=>x==='unknown').length} zásadních otázek; ${Object.values(draft.budget).filter(x=>x.unknown).length} finančních údajů. Neznámá data a vlastnictví zůstanou uložena také.</p><p>Chcete něco opravit? Vraťte se tlačítkem Zpět nebo vyberte krok nahoře.</p></div><div class="q-card"><h2>Zaškrtněte všechny čtyři body ★</h2>${checkbox('confirm.family','Uvedl/a jsem všechny děti a důležité osoby, o kterých vím. Pokud si nejsem jistý/á, označil/a jsem to.','q-confirm')}${checkbox('confirm.property','Uvedl/a jsem majetek i dluhy. Nejasné částky a vlastnictví jsem označil/a jako Nevím.','q-confirm')}${checkbox('confirm.truth','Odpovědi odpovídají tomu, co nyní vím. Odhady a nejasnosti ještě projdu s poradcem.','q-confirm')}${checkbox('confirm.delivery','Rozumím, že se odpovědi stáhnou do souboru. Soubor obsahuje soukromé údaje a musím ho sám/sama bezpečně předat poradci.','q-confirm')}</div>`;
}
function crisisQuestions(){return `<div class="q-card"><h2>Vaše rodinná příručka</h2><p>Dobrovolně přidejte smlouvy a kontakty. Když je nemáte po ruce, můžete tuto část přeskočit a doplnit později. Žádná hesla ani PINy.</p>${Object.entries(crisisTables).filter(([key])=>key!=='tasks').map(([key,s])=>`<details data-crisis-section="${key}"><summary>${s.title} (${draft.crisis[key].length})</summary>${draft.crisis[key].map((r,i)=>`<section class="q-card"><div class="q-row"><h3>Záznam ${i+1}</h3><button type="button" data-crisis-remove="${key}" data-row="${i}">Odebrat</button></div><div class="form-grid">${Object.entries(s.fields).map(([k,l])=>field('crisis.'+key+'.'+i+'.'+k,l,{extra:'maxlength="2000"'})).join('')}</div></section>`).join('')}<button type="button" data-crisis-new="${key}">+ Přidat ${s.single}</button></details>`).join('')}</div>`;}
function personCard(p,i){const path='people.'+i;return `<section class="q-card"><div class="q-row"><h2>Člověk ${i+1}${p.name?' · '+esc(p.name):''}</h2><button type="button" data-remove-person="${i}">Odebrat</button></div><div class="form-grid">${field(path+'.name','Jak se jmenuje? ★',{extra:'maxlength="120"'})}${select(path+'.appearance','Postavička v plánu (nepovinné)',[['male','Muž / chlapec'],['female','Žena / dívka'],['neutral','Neutrální']])}${select(path+'.role','Kdo je to pro vás? ★',Object.entries(roles))}<div>${field(path+'.birth','Kdy se narodil/a? ★',{type:'date',extra:p.birthUnknown?'disabled':''})}${checkbox(path+'.birthUnknown','Narození nevím')}</div>${select(path+'.life','Žije tento člověk? ★',[['alive','Ano, žije'],['dead','Ne, zemřel/a'],['unknown','Nevím']])}${p.role==='child'?select(path+'.otherParent','Kdo je druhý právní rodič dítěte? ★',[...draft.people.filter(x=>x.id!==p.id).map(x=>[x.id,x.name||'Osoba bez jména']),['only','Jsem jediný právní rodič'],['unknown','Nevím / druhého rodiče zatím nemám uvedeného']]):''}</div>${p.role==='partner'?`<div class="form-grid" style="margin-top:16px">${select(path+'.year','Bydlíte spolu alespoň rok? ★',choices)}${select(path+'.care','Pečujete o domácnost nebo je někdo výživově závislý? ★',choices)}</div>`:''}${textarea(path+'.note',p.role==='other'?'Popište, jak do rodiny patří. ★':'Co dalšího o vztahu máme vědět?','Například: dcera partnera, vnuk po zemřelé dceři, dřívější manželství a rok rozvodu.')}</section>`;}
function assetCard(a,i){const p='assets.'+i;return `<section class="q-card"><div class="q-row"><h2>${a.kind==='asset'?'Majetek':'Dluh'} ${esc(a.name)}</h2><button type="button" data-remove-asset="${i}">Odebrat</button></div><div class="form-grid">${field(p+'.name','Jak položku pojmenujeme? ★',{extra:'maxlength="120"',hint:a.kind==='asset'?'Např. rodinný dům, spoření, auto.':'Např. hypotéka, půjčka, ručení za firmu.'})}${select(p+'.category','Co to je? ★',(a.kind==='asset'?['Nemovitosti','Bankovní účty','Spořicí účty','Investiční fondy','Akcie','Dluhopisy','Kryptoměny','Podíly ve společnostech','Podnikatelský majetek','Automobily','Pohledávky','Hotovost','Ostatní majetek']:['Hypotéky','Spotřebitelské úvěry','Podnikatelské úvěry','Soukromé půjčky','Ručení','Další závazky']).map(x=>[x,x]))}<div>${field(p+'.value',a.kind==='asset'?'Kolik stojí celá položka? ★':'Kolik ještě zbývá splatit / za kolik ručíte? ★',{type:'number',extra:`min="0" step="any" ${a.valueUnknown?'disabled':''}`})}${checkbox(p+'.valueUnknown','Částku nevím')}</div>${select(p+'.currency','V jaké měně? ★',[['CZK','Koruny (Kč)'],['EUR','Eura'],['USD','Dolary']])}${select(p+'.owner',a.kind==='asset'?'Komu patří? ★':'Koho se dluh týká? ★',[['me','Jen mě'],['person','Jen jiné uvedené osoby'],['joint','Nás obou — společné jmění manželů'],['shares','Mě a další osoby v podílech'],['unknown','Nevím / je to složitější']])}${['person','shares'].includes(a.owner)?select(p+'.person','Které další osoby? ★',draft.people.map(x=>[x.id,x.name||'Osoba bez jména'])):''}${a.owner==='shares'?field(p+'.share','Váš podíl z celé položky (%) ★',{type:'number',extra:'min="0.01" max="99.99" step="any"',hint:'Druhé osobě připadne zbytek. Více vlastníků označte Nevím / je to složitější a popište je níže.'}):''}${select(p+'.acquisition',a.kind==='asset'?'Jak jste majetek získali? ★':'Kdy nebo jak dluh vznikl? ★',[['purchase',a.kind==='asset'?'Koupí / z příjmů':'Za současného vztahu'],['before','Před současným manželstvím'],['gift','Darem / převodem'],['inheritance','Dědictvím'],['unknown','Nevím / jinak']])}</div>${a.kind==='asset'?checkbox(p+'.liquid','Jsou to peníze, které se dají rychle použít.'):''}${textarea(p+'.note','Co potřebujete vysvětlit?','Např. více vlastníků, ručení, dům psaný na jednu osobu, ale koupený za manželství.')}</section>`;}
function download(name,obj){obj=structuredClone(obj);if(obj.exchange)obj.exchange={...obj.exchange,source:'family-plan',exportId:crypto.randomUUID(),exportedAt:new Date().toISOString()};const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function finish(){errors=intakeErrors(draft);if(errors.length){render();document.getElementById('q-errors').focus();return;}draft.status='submitted';draft.submittedAt=new Date().toISOString();download('odpovedi-rodinny-plan.json',draft);success=true;render();window.scrollTo(0,0);}
function finished(){return `<section class="panel q-success">${icon(6)}<h1>Odpovědi jsou připravené.</h1><p><b>Ještě nejsou odeslané.</b> Soubor <strong>odpovedi-rodinny-plan.json</strong> najdete mezi staženými soubory.</p><div class="q-tip">1. Najděte stažený soubor.<br>2. Předejte ho poradci způsobem, na kterém jste se domluvili.<br>3. Společně doplníte nejasnosti. Teprve potom vznikne plán.</div><div class="toolbar" style="justify-content:center;margin-top:25px"><button class="primary" data-action="again">Stáhnout odpovědi znovu</button><button data-action="edit">Vrátit se k odpovědím</button></div><p class="q-help">Když se nic nestáhlo, otevřete dotazník v běžném prohlížeči Safari, Chrome nebo Edge a zkuste to znovu. Nikam nevkládejte soubor veřejně.</p></section>`;}
function move(target){if(target>step){errors=[];for(let i=step;i<target;i++)errors.push(...intakeErrors(draft,i));if(errors.length){render();document.getElementById('q-errors').focus();return;}}step=target;errors=[];render();root.querySelector('h1')?.focus();window.scrollTo(0,0);}
root.addEventListener('input',e=>{const el=e.target;if(el.dataset.path&&el.type!=='radio')put(el.dataset.path,el.type==='checkbox'?el.checked:el.value);});
root.addEventListener('change',e=>{const el=e.target;if(!el.dataset.path)return;put(el.dataset.path,el.type==='checkbox'?el.checked:el.value);if(el.type==='checkbox'||el.tagName==='SELECT')render();});
root.addEventListener('submit',e=>{e.preventDefault();step===6?finish():move(step+1);});
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.crisisNew){const key=b.dataset.crisisNew;draft.crisis[key].push(Object.fromEntries(Object.keys(crisisTables[key].fields).map(k=>[k,''])));render();root.querySelector('[data-crisis-section="'+key+'"]').open=true;return;}if(b.dataset.crisisRemove){const key=b.dataset.crisisRemove;draft.crisis[key].splice(Number(b.dataset.row),1);render();root.querySelector('[data-crisis-section="'+key+'"]').open=true;return;}if(b.dataset.step!==undefined){move(Number(b.dataset.step));return;}if(b.dataset.removePerson!==undefined){const p=draft.people[Number(b.dataset.removePerson)];draft.people.splice(Number(b.dataset.removePerson),1);draft.people.forEach(x=>{if(x.otherParent===p.id)x.otherParent='unknown';});draft.assets.forEach(x=>{if(x.person===p.id){x.person='';x.owner='unknown';}});render();return;}if(b.dataset.removeAsset!==undefined){draft.assets.splice(Number(b.dataset.removeAsset),1);render();return;}switch(b.dataset.action){case 'back':move(step-1);break;case 'person':draft.people.push({id:crypto.randomUUID(),name:'',birth:'',birthUnknown:false,role:'',life:'',otherParent:'',year:'',care:'',note:''});render();break;case 'asset':case 'debt':draft.assets.push({id:crypto.randomUUID(),name:'',kind:b.dataset.action,category:'',value:'',valueUnknown:false,currency:'CZK',owner:'',person:'',share:'',acquisition:'',liquid:false,note:''});render();break;case 'draft':download('rozpracovany-rodinny-plan.json',{...draft,status:'draft'});document.getElementById('q-status').textContent='Rozpracovaný soubor je připraven ke stažení. Příště jej načtěte tlačítkem Pokračovat ze souboru.';break;case 'resume':{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.hidden=true;document.body.append(inp);inp.oncancel=()=>inp.remove();inp.onchange=async()=>{try{if(!inp.files[0])return;if(inp.files[0].size>5_000_000)throw Error('Maximum 5 MB.');draft=parseIntake(await inp.files[0].text(),{draft:true});step=0;success=false;errors=[];render();}catch(err){errors=[err.message];render();}finally{inp.remove();}};inp.click();break;}case 'again':download('odpovedi-rodinny-plan.json',draft);break;case 'edit':success=false;render();break;}}catch(err){errors=[err.message];render();}});
try{const data=document.getElementById('prefill-data');if(data)draft=parseIntake(data.textContent,{draft:true});}catch(error){errors=[error.message];}
window.addEventListener('beforeunload',e=>{if(!success&&draft.self.name){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
